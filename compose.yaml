name: flashsale-lab
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: flashsale
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:55432:5432"]
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all", "-c", "log_min_duration_statement=200", "-c", "max_connections=120"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d flashsale"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Store: Host=db;Database=flashsale;Username=lab;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};Maximum Pool Size=50;Timeout=5
      Database__Initialize: "true"
    depends_on:
      db: { condition: service_healthy }
  k6:
    image: grafana/k6:1.3.0
    profiles: ["load"]
    user: "0:0"
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    environment:
      BASE_URL: http://api:8080
      NO_PROXY: api,db,localhost,127.0.0.1
      no_proxy: api,db,localhost,127.0.0.1
    entrypoint: ["k6"]
    command: ["run", "/scripts/load.js"]
volumes:
  pgdata:
